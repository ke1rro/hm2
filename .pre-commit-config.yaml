repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --locked --no-sync black
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: isort
        name: isort
        entry: uv run --locked --no-sync isort
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: uv run --locked --no-sync flake8
        language: system
        types: [python]
      - id: ty
        name: ty type checking
        entry: uv run --locked --no-sync ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: mdformat
        name: mdformat
        entry: uv run --locked --no-sync mdformat
        args: ["--check"]
        language: system
        types: [markdown]

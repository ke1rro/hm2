[project]
name = "hm2"
version = "0.1.0"
description = "UCU AI 2026 object detection homework with VisDrone video frames"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "faster-coco-eval>=1.8.0",
    "google-api-python-client>=2.180",
    "google-auth>=2.40",
    "google-auth-oauthlib>=1.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.5",
    "kagglehub>=1.0.3",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pycocotools>=2.0.11",
    "python-decouple>=3.8",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
    "ultralytics==8.3.235",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["hm2"]
skip_gitignore = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "black[jupyter]==26.5.1",
    "flake8==7.3.0",
    "isort==8.0.1",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.2.0",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ty>=0.0.95",
]

[dataset]
frame_stride = 4
image_size = 1280
jpeg_quality = 95
should_mask_ignored = true
ignore_fill = 114
validation_clips = [
    "uav0000268_05773_v",
    "uav0000150_02310_v",
    "uav0000361_02323_v",
    "uav0000143_02250_v",
    "uav0000278_00001_v",
    "uav0000020_00406_v",
]

[dataset]
frame_stride = 5
expected_selected_frames = 4868
expected_selected_clips = 56
expected_validation_frames = 2846
should_stage_images = true

[model]
backend = "ultralytics"
model_id = "yolo11s.pt"
pretrained = true
min_size = 640
max_size = 1024
num_classes = 8
score_thresh = 0.05
nms_thresh = 0.5
detections_per_img = 500
is_ignore_aware = true

[loss]
box = 7.5
cls = 0.5
dfl = 1.5

[training]
seed = 2026
epochs = 5
batch_size = 2
num_workers = 2
learning_rate = 0.0025
warmup_updates = 100
flip_probability = 0.5
checkpoint_seconds = 600

[evaluation]
batch_size = 2
num_workers = 2
